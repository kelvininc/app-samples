server {
    listen 8080;
    default_type text/plain;

    location = /health/live {
        return 200 "live\n";                 # the HTTP server can respond
    }

    location = /health/ready {
        if (!-f /tmp/reports-ready) {
            return 503 "reports loading\n";  # initialization hasn't completed
        }
        return 200 "ready\n";
    }

    location / {
        return 404;
    }
}
