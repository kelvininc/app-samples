# yaml-language-server: $schema=https://apps.kelvininc.com/schemas/kelvin/5.0.0/docker.json

# YAML (Structure) Spec Version
spec_version: 5.0.0
# Type
type: docker

# Info
name: mqtt-mosquitto
title: MQTT Mosquitto Broker
description: This Docker application runs an MQTT Mosquitto broker, configurable via the application configuration.
version: 2.0.1

# Capabilities
flags:
  enable_runtime_update:
    # Reload Application Configuration in runtime
    configuration: false

# UI JSON schemas (Optional)
ui_schemas:
  # Application Configuration Schema
  configuration: "ui_schemas/configuration.json"

# Defaults (Runtime/Deployment)
defaults:
  # Application Configuration Default Values
  configuration:
    # At least one listener must be enabled or the broker exits.
    listeners:
      plain:
        port: 21883                       # keep in sync with the service port in system.ports
        auth:
          mode: ANONYMOUS                 # ANONYMOUS | PASSWORD
          # To require authentication, set mode: PASSWORD and add:
          #   username: "<% secrets.mqtt-user %>"
          #   password: "<% secrets.mqtt-password %>"
      secure:
        auth:
          mode: ANONYMOUS                 # seeds the oneOf discriminator so the UI form can
                                          # switch branches; the listener stays off until you
                                          # also set secure.port below
      # The secure listener is off unless you set its port. Add the matching service port
      # in system.ports (28883 is already declared below). Certificates are required;
      # without all three the broker will refuse to start rather than listen unencrypted.
      #   secure:
      #     port: 28883
      #     auth:
      #       mode: ANONYMOUS             # ANONYMOUS | PASSWORD
      #       # username: "<% secrets.mqtt-ssl-user %>"
      #       # password: "<% secrets.mqtt-ssl-password %>"
      #     tls:
      #       ca_crt: "<% secrets.mqtt-ssl-ca-crt %>"
      #       tls_crt: "<% secrets.mqtt-ssl-tls-crt %>"
      #       tls_key: "<% secrets.mqtt-ssl-tls-key %>"

  # System Settings
  system:
    volumes:
      - name: mqtt-persistent-data
        type: persistent
        target: /mosquitto/data
    ports:
      # Other workloads reach the broker at <workload-name>:<port>.
      # For clients outside the cluster, add host-type ports on the
      # deployment (see README.md):
      #   - name: mqtt-insecure
      #     type: host
      #     host:
      #       port: 21883
      - name: cluster-mqtt-insecure
        type: service
        service:
          port: 21883
      - name: cluster-mqtt-secure
        type: service
        service:
          port: 28883
