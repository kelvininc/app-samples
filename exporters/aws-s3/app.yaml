spec_version: 5.0.0
type: exporter

name: aws-s3-exporter
title: AWS S3 Exporter
description: This exporter uploads data to an AWS S3 bucket.
version: 2.0.7

# Runtime update is off: the exporter builds its client and buffer at startup, so IO-mapping and
# configuration changes are applied by redeploying the workload (the platform restarts it).
flags:
  enable_runtime_update:
    io: false
    configuration: false

exporter_io:
  - name: default
    data_types:
      - number
      - string
      - boolean

ui_schemas:
  configuration: "ui_schemas/configuration.json"

defaults:
  configuration:
    s3:
      region: "us-east-1"
      bucket: "amzn-s3-demo-bucket"
      prefix: ""
      # Credentials have NO default: leave them unset to use the AWS default credential
      # chain (IAM role on the cluster), or wire each to a secret per deployment, e.g.:
      #   auth:
      #     access_key_id: "<% secrets.aws-access-key-id %>"
      #     secret_access_key: "<% secrets.aws-secret-access-key %>"
    upload:
      interval: 60
      batch_size: 1000
      format: parquet           # "parquet" | "csv" | "json"
      retry:
        attempts: 3
        base_delay: 1
        max_delay: 30           # backoff ceiling, independent of upload.interval
    buffer:
      max_backlog: 1000000      # rows kept before dropping oldest; 0 = unbounded

  system:
    # Persistent buffer: mount the directory (not just data.db) so the DuckDB file AND its
    # data.db.wal sidecar survive a crash and restart (do NOT drop this).
    volumes:
      - name: data
        target: data
        type: persistent
