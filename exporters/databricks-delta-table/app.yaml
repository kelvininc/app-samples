spec_version: 5.0.0
type: exporter

name: databricks-delta-table-exporter
title: Databricks Delta Table
description: This exporter uploads data to a Databricks Delta Table.
version: 2.0.0

# Runtime update is off: the exporter builds its client and buffer at startup, so IO-mapping and
# configuration changes are applied by redeploying the workload (the platform restarts it).
flags:
  enable_runtime_update:
    io: false
    configuration: false

exporter_io:
  - name: default
    data_types:
      - number
      - string
      - boolean

ui_schemas:
  configuration: "ui_schemas/configuration.json"

defaults:
  configuration:
    databricks:
      server_hostname: ""
      http_path: ""
      delta_table: ""
      auth:
        method: oauth            # "oauth" | "access_token"
        # Credentials have NO default: a baked-in <% secrets %> makes them always-truthy
        # and defeats the one-auth validator. Wire each to a secret per deployment, e.g.:
        #   client_id: "<% secrets.databricks-client-id %>"
        #   client_secret: "<% secrets.databricks-client-secret %>"
        #   access_token: "<% secrets.databricks-access-token %>"
    upload:
      interval: 60
      batch_size: 1000
      retry:
        attempts: 3
        base_delay: 1
        max_delay: 30           # backoff ceiling, independent of upload.interval
    buffer:
      max_backlog: 0            # 0 = unbounded; set a cap to bound disk on prolonged outage

  system:
    # Persistent buffer: the DuckDB file must survive restarts (do NOT drop this).
    volumes:
      - name: data
        target: data.db
        type: persistent
