spec_version: 5.0.0
type: exporter

name: databricks-zerobus-exporter
title: Databricks Zerobus Exporter
description: This exporter streams data directly into a Databricks Unity Catalog Delta table using the Zerobus Ingest API.
version: 2.0.0

# Runtime update is off: the exporter builds its client and buffer at startup, so IO-mapping and
# configuration changes are applied by redeploying the workload (the platform restarts it).
flags:
  enable_runtime_update:
    io: false
    configuration: false

exporter_io:
  - name: default
    data_types:
      - number
      - string
      - boolean

ui_schemas:
  configuration: "ui_schemas/configuration.json"

defaults:
  configuration:
    databricks:
      server_hostname: ""        # workspace hostname, used for OAuth (e.g. dbc-xxxx.cloud.databricks.com)
      zerobus_endpoint: ""       # gRPC ingestion endpoint (e.g. 123.zerobus.<region>.cloud.databricks.com)
      delta_table: ""            # catalog.schema.table
      auth: {}                   # must be an object (the ui schema types it), never a bare key
        # Credentials have NO default: a baked-in <% secrets %> makes them always-truthy
        # and defeats the require-both validator. Wire each to a secret per deployment, e.g.:
        #   client_id: "<% secrets.databricks-client-id %>"
        #   client_secret: "<% secrets.databricks-client-secret %>"
    upload:
      interval: 60
      batch_size: 1000
      retry:
        attempts: 3
        base_delay: 1
        max_delay: 30           # backoff ceiling, independent of upload.interval
    buffer:
      max_backlog: 1000000      # rows kept before dropping oldest; 0 = unbounded

  system:
    # Persistent buffer: the DuckDB file must survive restarts (do NOT drop this). The whole
    # directory is mounted (not just the .db file) so the WAL sidecar survives a crash too.
    volumes:
      - name: data
        target: data
        type: persistent
