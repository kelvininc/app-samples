spec_version: 5.0.0
type: exporter

name: kafka-exporter
title: Kafka
description: This exporter publishes asset data to Kafka topics, one JSON message per record.
version: 1.0.0

# Runtime update is off: the exporter builds its producer, topic map and buffer at startup, so
# IO-mapping and configuration changes are applied by redeploying the workload (the platform
# restarts it).
flags:
  enable_runtime_update:
    io: false
    configuration: false

exporter_io:
  - name: default
    data_types:
      - number
      - string
      - boolean

ui_schemas:
  configuration: "ui_schemas/configuration.json"
  io_configuration:
    default: "ui_schemas/io_default.json"   # per-stream: topic (required, {asset}/{stream} placeholders)

defaults:
  configuration:
    kafka:
      bootstrap_servers: ""                 # REQUIRED: comma-separated host:port list
      client_id: kelvin-kafka-exporter
      security:
        protocol: PLAINTEXT                 # PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL
        # To authenticate, set a SASL_* protocol AND the matching sasl block (the two must
        # agree), e.g. protocol: SASL_SSL with:
        #   sasl:
        #     mechanism: SCRAM-SHA-256      # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
        #     username: kelvin-exporter
        #     password: "<% secrets.kafka-password %>"
        # For mTLS or a private CA (SSL / SASL_SSL only), wire PEM content to secrets:
        #   tls:
        #     ca_cert: "<% secrets.kafka-ca-cert %>"           # optional; empty = system CAs
        #     client_cert: "<% secrets.kafka-client-cert %>"   # both or neither
        #     client_key: "<% secrets.kafka-client-key %>"
    upload:
      interval: 60
      batch_size: 1000
      retry:
        attempts: 3
        base_delay: 1
        max_delay: 30           # backoff ceiling, independent of upload.interval
    buffer:
      max_backlog: 0            # 0 = unbounded; set a cap to bound disk on prolonged outage

  system:
    # Persistent buffer: the DuckDB file must survive restarts (do NOT drop this).
    volumes:
      - name: data
        target: data.db
        type: persistent
