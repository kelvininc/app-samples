spec_version: 5.0.0
type: exporter

name: sftp-exporter
title: SFTP Exporter
description: This exporter uploads data to an SFTP server.
version: 2.0.0

# Runtime update is off: the exporter builds its client and buffer at startup, so IO-mapping and
# configuration changes are applied by redeploying the workload (the platform restarts it).
flags:
  enable_runtime_update:
    io: false
    configuration: false

exporter_io:
  - name: default
    data_types:
      - number
      - string
      - boolean

ui_schemas:
  configuration: "ui_schemas/configuration.json"

defaults:
  configuration:
    sftp:
      host: ""
      port: 22
      username: ""
      remote_dir: "."
      timeout: 30                 # network timeout (s) for connect/auth/transfers
      verify_host_key: true       # set false to auto-accept unknown host keys (dev only; MITM risk)
      # known_hosts: "/opt/kelvin/share/known_hosts"   # optional: verify against this file
      auth:
        method: password          # "password" | "private_key"
        # Credentials have NO default: a baked-in <% secrets %> makes them always-truthy
        # and defeats the one-auth validator. Wire each to a secret per deployment, e.g.:
        #   password: "<% secrets.sftp-password %>"
        #   private_key: "<% secrets.sftp-private-key %>"
        #   private_key_passphrase: "<% secrets.sftp-private-key-passphrase %>"
    upload:
      interval: 60
      batch_size: 1000
      format: parquet           # "parquet" | "csv" | "json"
      retry:
        attempts: 3
        base_delay: 1
        max_delay: 30           # backoff ceiling, independent of upload.interval
    buffer:
      max_backlog: 1000000      # rows kept before dropping oldest; 0 = unbounded

  system:
    # Persistent buffer: the DuckDB dir must survive restarts (do NOT drop this). The whole
    # directory is mounted so the WAL sidecar file survives alongside the db on a crash.
    volumes:
      - name: data
        target: data
        type: persistent
